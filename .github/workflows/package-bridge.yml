name: Package HyFlez Bridge

on:
  push:
    paths:
      - "HyFlezBridge_BP/**"
      - ".github/workflows/package-bridge.yml"
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build behavior pack
        run: |
          cd HyFlezBridge_BP
          zip -r ../HyFlezBridge.mcpack .
      - name: Wrap pack as mcaddon
        run: |
          zip -j HyFlezBridge.mcaddon HyFlezBridge.mcpack
      - name: Upload Bridge
        uses: actions/upload-artifact@v4
        with:
          name: HyFlezBridge-mcaddon
          path: HyFlezBridge.mcaddon
          if-no-files-found: error
          retention-days: 90
